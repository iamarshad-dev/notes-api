spring:
  application:
    name: notes-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true

  output:
    ansi:
      enabled: always


app:
  jwt:
    issuer: notes-api
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    audience: notes-api

  refresh-token:
    ttl: 7d
    cleanup-enabled: true
    cleanup-interval: PT1H

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}


logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%logger{36}){cyan} - %msg%n"

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
